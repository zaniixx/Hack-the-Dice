<!-- Stylesheets are loaded in cascade order: tokens and base first, then one
     file per region of the console, then effects and responsive overrides. -->
<script>
/*
 * Fail loudly. A module that will not load would otherwise leave a black
 * screen with nothing to go on, which is the worst thing that can happen in
 * front of a judge. Anything thrown before the game finishes booting is shown
 * here; once it is running, errors go to the console as usual.
 */
(function () {
  function report(message) {
    if (window.__htdBooted) return;
    var box = document.getElementById('bootError');
    if (!box) {
      box = document.createElement('div');
      box.id = 'bootError';
      box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0b0a14;color:#ff4d6d;' +
        'font:14px/1.6 ui-monospace,monospace;padding:26px;overflow:auto;white-space:pre-wrap';
      box.textContent = 'HACK THE DICE did not start.\n\n' +
        'If you just updated the game, hard-refresh (ctrl-shift-R): a half-cached\n' +
        'set of modules is the usual cause. Serving with tools/serve.py avoids it.\n\n';
      (document.body || document.documentElement).appendChild(box);
    }
    box.textContent += message + '\n';
  }
  addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT') {
      report('could not load ' + (event.target.src || 'a script'));
    } else {
      report(event.message || String(event.error));
    }
  }, true);
  addEventListener('unhandledrejection', function (event) {
    report(String((event.reason && event.reason.message) || event.reason));
  });
})();
</script>
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/target.css">
<link rel="stylesheet" href="src/styles/board.css">
<link rel="stylesheet" href="src/styles/buttons.css">
<link rel="stylesheet" href="src/styles/toolkit.css">
<link rel="stylesheet" href="src/styles/effects.css">
<link rel="stylesheet" href="src/styles/arcade.css">
<link rel="stylesheet" href="src/styles/responsive.css">
<link rel="stylesheet" href="src/styles/cutscene.css">
<link rel="stylesheet" href="src/styles/tutorial.css">
<link rel="stylesheet" href="src/styles/mobile.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">HACK<b>THE</b>DICE</div>
    <div class="stat"><small>Runner</small><span id="tHandle">—</span><em id="tTier"></em></div>
    <div class="stat"><small>Server</small><span id="tServer">1</span><em id="tCorp">OMNIDYNE</em></div>
    <div class="stat"><small>Node</small><span id="tNode">1/5</span></div>
    <div class="stat"><small>Data scrap</small><span id="tScrap">0</span></div>
    <div class="stat"><small>Seed</small><span id="tSeed" class="copyable" title="Click to copy this run's seed">—</span></div>
    <div class="stat"><small>Best run</small><span id="tBest">—</span></div>
    <div class="stat" id="tOpWrap" hidden><small>Tournament</small><span id="tOp"></span></div>
    <div class="spacer"></div>
    <div class="topbtns">
      <button class="btn sm touch-only" id="btnRig" title="Black market and rig">RIG</button>
      <button class="btn sm touch-only" id="btnLog" title="Console log">LOG</button>
      <button class="btn sm touch-only" id="btnFull" title="Full screen">FULL</button>
      <button class="btn sm" id="btnSpeed" title="Animation speed">SPD 1×</button>
      <button class="btn sm" id="btnSound" title="Toggle sound">SND ON</button>
      <button class="btn sm" id="btnMenu">MENU</button>
    </div>
  </header>

  <main class="grid" id="grid">
    <section class="panel left" aria-label="Target">
      <div class="ptitle"><span>TARGET</span><span class="tag" id="nodeTag">NODE 1/5</span></div>
      <div class="screen target">
        <div class="ename" id="nodeName">NO TARGET</div>
        <div class="ecan-wrap"><canvas id="enemy" width="64" height="48"></canvas><div class="eoverlay" id="eOverlay"></div></div>
        <div class="fw">
          <div class="fw-top"><span>FIREWALL</span><span id="fwText">OFFLINE</span></div>
          <div class="fw-bar" id="fwBar"><i class="ghost" id="fwGhost"></i><i class="fill" id="fwFill"></i></div>
        </div>
        <div class="bossrule" id="bossRule"></div>
      </div>
      <div class="screen logbox">
        <div class="log" id="log" aria-live="polite"></div>
        <button class="btn sm sheet-close touch-only" data-close-sheet>CLOSE</button>
      </div>
    </section>

    <section class="panel center" aria-label="Board">
      <div class="arts" id="arts"></div>
      <div class="screen board-wrap" id="boardWrap">
        <canvas id="board"></canvas>
        <div class="combo" id="combo"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="screen scorebar">
        <div class="sbox bits"><span class="lbl">BITS</span><span class="val" id="bits">0</span></div>
        <span class="op">×</span>
        <div class="sbox mult"><span class="lbl">MULT</span><span class="val" id="mult">1</span></div>
        <span class="op">=</span>
        <div class="sbox power"><span class="lbl">HACKING POWER</span><span class="val" id="power">0</span></div>
      </div>
      <div class="controls">
        <div class="meters">
          <div class="meter">Executes left <span class="pips" id="execPips"></span></div>
          <div class="meter">Rerolls <span class="pips rr" id="rerollPips"></span></div>
        </div>
        <div class="btnrow">
          <button class="btn cyan" id="btnRoll">ROLL</button>
          <button class="btn" id="btnReroll">REROLL</button>
          <button class="btn mag" id="btnExec">EXECUTE</button>
        </div>
        <div class="abils" id="abils"></div>
      </div>
    </section>

    <section class="panel right" aria-label="Toolkit">
      <div class="ptitle">
        <span>TOOLKIT</span><span class="tag">Black market + rig</span>
        <button class="btn sm sheet-close touch-only" data-close-sheet>CLOSE</button>
      </div>
      <div class="screen toolkit" id="toolkit">
        <div class="sec-h">BLACK MARKET <button class="btn sm" id="btnShopReroll">REFRESH</button></div>
        <div class="shop" id="shop"></div>
        <button class="btn lime wide" id="btnNext" hidden>BREACH NEXT NODE</button>
        <div class="sec-h">DICE POOL <span id="diceCount"></span></div>
        <div class="inv" id="diceInv"></div>
        <div class="sec-h">ABILITIES <span id="abilCount"></span></div>
        <div id="abilInv"></div>
        <div class="sec-h">CYBERARTIFACTS <span id="artCount"></span></div>
        <div id="artInv"></div>
      </div>
    </section>
  </main>
</div>
<div id="cutscene" class="cutscene" hidden>
  <div class="cut-panel">
    <span class="cut-label" id="cutLabel"></span>
    <canvas class="cut-sprite" id="cutSprite" width="64" height="48"></canvas>
    <h2 class="cut-name" id="cutName" data-text=""></h2>
    <p class="cut-rule" id="cutRule"></p>
    <p class="cut-line" id="cutLine"></p>
    <span class="cut-go">PRESS ANY KEY TO ENGAGE</span>
  </div>
</div>
<div id="coach" class="coach" hidden>
  <div class="coach-ring" id="coachRing"></div>
  <div class="coach-note" id="coachNote">
    <b id="coachTitle"></b>
    <p id="coachText"></p>
    <div class="coach-actions">
      <span class="coach-step" id="coachStep"></span>
      <button class="btn sm" id="coachSkip">SKIP TUTORIAL</button>
    </div>
  </div>
</div>
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<div id="start" class="start-screen" hidden></div>
<div id="fx"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<script type="module" src="src/main.js"></script>
</body>
