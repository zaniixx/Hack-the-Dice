<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hack the Dice — icon</title>
<style>
/* The app icon: one die, drawn by the game's own sprite painter. 512x512. */
html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #07060f; }
canvas { display: block; width: 512px; height: 512px; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="icon" width="32" height="32"></canvas>
<script type="module">
import { dieSprite } from '../src/render/die-sprites.js';

const canvas = document.getElementById('icon');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// A dark plate with a circuit dot grid, so the icon reads at small sizes.
ctx.fillStyle = '#07060f';
ctx.fillRect(0, 0, 32, 32);
ctx.fillStyle = '#1b1736';
for (let x = 2; x < 32; x += 6) for (let y = 2; y < 32; y += 6) ctx.fillRect(x, y, 1, 1);
ctx.fillStyle = '#241e42';
ctx.fillRect(0, 0, 32, 1); ctx.fillRect(0, 31, 32, 1);
ctx.fillRect(0, 0, 1, 32); ctx.fillRect(31, 0, 1, 32);

// The die itself, filling most of the tile.
ctx.drawImage(dieSprite('d6', 5), 0, 0, 16, 16, 4, 4, 24, 24);
</script>
</body>
</html>
