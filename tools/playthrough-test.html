<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hack the Dice — playthrough test</title>
<style>
  body { background:#0b0a14; color:#dfe6ff; font:13px/1.5 ui-monospace, monospace; margin:0; }
  #report { position:fixed; inset:0 0 auto 0; z-index:999; background:#08070fee; padding:10px 14px;
            max-height:100vh; overflow:auto; border-bottom:2px solid #241e42; }
  #report h1 { font-size:14px; color:#3df2ff; margin:0 0 8px; }
  #report h2 { font-size:12px; color:#9a7bff; margin:10px 0 2px; }
  .pass { color:#b6ff3d; }
  .fail { color:#ff4d6d; font-weight:bold; }
  .total { font-size:14px; margin-top:10px; }
</style>
</head>
<body>
<div id="report"><h1>Hack the Dice — playthrough test</h1><div id="lines">running...</div></div>

<script type="module">
/*
 * End-to-end test. It loads the real markup from index.html, boots the real
 * game, and drives it through a node, the three boss rules, a trace, a
 * migration, and a save/resume round trip.
 *
 * Open it through a static server (see the README). Append ?ping to also mirror
 * each result to the server log, which is how it is run headlessly.
 *
 * The player's saved run and personal best are stashed and restored, so running
 * this does not cost anyone their progress.
 */
const report = document.getElementById('lines');
const ping = location.search.includes('ping');
const sent = [];
let failures = 0;

function say(html, cls = '') {
  report.insertAdjacentHTML('beforeend', `<div class="${cls}">${html}</div>`);
  if (ping) sent.push(fetch('/__t/' + encodeURIComponent(html.replace(/<[^>]+>/g, ''))).catch(() => {}));
}
function section(title) {
  report.insertAdjacentHTML('beforeend', `<h2>${title}</h2>`);
}
function check(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (!ok) failures++;
  say(`${ok ? 'PASS' : 'FAIL'} ${name}` +
    (ok ? '' : ` — got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}`),
    ok ? 'pass' : 'fail');
}
window.onerror = (message, file, lineNo) => { failures++; say(`ERROR ${message} @${lineNo}`, 'fail'); };
addEventListener('unhandledrejection', event => {
  failures++;
  say(`REJECTION ${(event.reason && event.reason.stack) || event.reason}`, 'fail');
});

// Keep the player's progress out of this.
const savedStorage = { ...localStorage };
const restoreStorage = () => {
  localStorage.clear();
  for (const [key, value] of Object.entries(savedStorage)) localStorage.setItem(key, value);
};

// Boot the real page: its markup, its stylesheets, its entry point.
const page = await (await fetch('../index.html')).text();
const markup = page.split('<body>')[1].split('<script')[0];
document.head.insertAdjacentHTML('beforeend',
  [...page.matchAll(/<link rel="stylesheet" href="([^"]+)">/g)]
    .map(m => `<link rel="stylesheet" href="../${m[1]}">`).join(''));
document.body.insertAdjacentHTML('beforeend', markup);

await import('../src/main.js');

const { settings } = await import('../src/core/settings.js');
// Namespace import, not a destructure: `run` is a live binding that starting a
// new run replaces, and a destructured copy would go stale.
const state = await import('../src/game/state.js');
const { startNewRun, beginNode, resumeRun } = await import('../src/game/session.js');
const { rollDice, rerollDice, onDiceSettled, refreshPreview, useAbility } = await import('../src/game/turn.js');
const { executePayload } = await import('../src/game/execute.js');
const { buyItem, sellItem, refreshShop, generateShop, reorderArtifacts } = await import('../src/game/shop.js');
const { isDraggingArtifacts, justDragged } = await import('../src/ui/artifact-drag.js');
const { loadSavedRun, saveRun } = await import('../src/game/save.js');
const { isLeakDraining, tickMemoryLeak } = await import('../src/game/memory-leak.js');
const board = await import('../src/engine/dice-board.js'); // `dice` is a live binding too
const { nodeHP } = await import('../src/data/enemies.js');
const { artifactSlots, priceOf, sellValueOf } = await import('../src/game/difficulty.js');
const { ARTIFACTS } = await import('../src/data/artifacts.js');
const market = await import('../src/ui/market.js');
const { bossOnNodeStart } = await import('../src/game/boss-rules.js');
const { isCutsceneOpen, closeCutscene } = await import('../src/ui/cutscene.js');
const { BOSSES } = await import('../src/data/bosses.js');
const { els } = await import('../src/ui/dom.js');
const { updateUI } = await import('../src/ui/hud.js');
const archive = await import('../src/game/archive.js');
const { archiveHTML } = await import('../src/ui/archive-view.js');

/** Skip the tumble: drop the dice where they are and hand control back. */
const settle = () => { board.forceSettleAll(); onDiceSettled(); };
const setFaces = values => board.dice.forEach((die, i) => { die.value = die.shownValue = values[i % values.length]; });

try {
  report.innerHTML = '';
  settings.speed = 4; // run the scoring animation at 4x

  section('A node, start to finish');
  check('starts at the title', state.run.phase, 'title');
  startNewRun();
  check('node loaded', state.run.phase, 'ready');
  check('four executes', state.run.executes, 4);
  check('first firewall', state.run.enemy.max, 40);
  check('five dice on the board', board.dice.length, 5);

  rollDice();
  check('dice are rolling', state.run.phase, 'rolling');
  settle();
  check('player may act', state.run.phase, 'manip');
  check('two rerolls', state.run.rerolls, 2);
  check('preview shows bits', Number(els.bits.textContent.replace(/,/g, '')) > 0, true);
  rerollDice();
  check('reroll spends one', state.run.rerolls, 1);
  settle();

  // A firewall too big to break, so the execute resolves without breaching.
  state.run.enemy.hp = state.run.enemy.max = 1e6;
  await executePayload();
  check('damage was dealt', state.run.stats.dmg > 0, true);
  check('execute was spent', state.run.executes, 3);
  check('ready for the next roll', state.run.phase, 'ready');

  section('Breach and market');
  const scrapBefore = state.run.scrap;
  state.run.enemy.hp = 1;
  rollDice();
  settle();
  await executePayload();
  check('breached into the market', state.run.phase, 'shop');
  check('the market opened itself over the board', market.isMarketOpen(), true);
  check('and it is really on screen', els.market.hidden, false);
  check('the breach button sits below the toolkit',
    els.nextNodeButton.closest('.panel-actions') !== null, true);
  check('and is offered while the market is open', els.nextNodeButton.hidden, false);
  check('node advanced', state.run.node, 2);
  check('breach was counted', state.run.stats.nodes, 1);
  check('scrap harvested', state.run.scrap > scrapBefore, true);
  check('market has offers', state.run.shop.length, 4);
  check('run was saved', !!loadSavedRun(), true);

  state.run.scrap = 99;
  const ownedBefore = state.run.artifacts.length + state.run.dice.length + state.run.abilities.length;
  buyItem(0);
  check('bought the first offer', state.run.artifacts.length + state.run.dice.length + state.run.abilities.length, ownedBefore + 1);
  check('scrap was spent', state.run.scrap < 99, true);
  const afterBuy = state.run.scrap;
  refreshShop();
  check('refresh cost scrap', state.run.scrap < afterBuy, true);
  check('refresh restocked', state.run.shop.length, 4);
  const diceBefore = state.run.dice.length;
  sellItem('die', 0);
  check('sold a die', state.run.dice.length, diceBefore - 1);

  // Closing it stays closed: the player is looking at their rig on purpose.
  market.closeMarket();
  updateUI();
  check('a closed market stays closed', market.isMarketOpen(), false);
  market.openMarket();
  check('and MARKET opens it again', market.isMarketOpen(), true);

  check('the market button is offered between nodes', els.marketButton.hidden, false);

  beginNode();
  check('starting a node closes the market', market.isMarketOpen(), false);
  check('and takes the breach button away', els.nextNodeButton.hidden, true);
  check('and the market button with it', els.marketButton.hidden, true);
  check('second node ready', state.run.phase, 'ready');
  check('second firewall', state.run.enemy.max, nodeHP(1, 2));

  section('Artifact slots and editions');
  startNewRun({ handle: 'ANON', difficulty: 'pen-tester', seed: 'STAMP-1' });
  check('a fresh rig holds five artifacts', artifactSlots(), 5);

  // Fill the rig, then try to buy past it.
  state.run.phase = 'shop';
  state.run.scrap = 999;
  state.run.artifacts = ['overclock', 'sniffer', 'parity', 'brute', 'trojan'];
  state.run.shop = [{ kind: 'art', id: 'cache' }];
  buyItem(0);
  check('a full rig refuses a sixth artifact', state.run.artifacts.length, 5);

  // NEGATIVE brings its own slot, so it fits where nothing else would.
  state.run.shop = [{ kind: 'art', id: 'cache', edition: 'negative' }];
  buyItem(0);
  check('negative fits into a full rig', state.run.artifacts.length, 6);
  check('and widens it', artifactSlots(), 6);
  check('the stamp was recorded', state.run.editions.cache, 'negative');

  // A stamp is priced on top of the artifact, and refunded on top of it too.
  check('a stamped artifact costs more',
    priceOf(ARTIFACTS.hash, 'prismatic') > priceOf(ARTIFACTS.hash), true);
  check('selling a stamped artifact pays for the stamp',
    sellValueOf(ARTIFACTS.cache, 'negative') > sellValueOf(ARTIFACTS.cache), true);

  const scrapBeforeSell = state.run.scrap;
  sellItem('art', 5);
  check('selling it takes the slot back', artifactSlots(), 5);
  check('and the stamp with it', state.run.editions.cache, undefined);
  check('it paid out', state.run.scrap > scrapBeforeSell, true);

  // A stamp pays into the execute alongside the artifact it sits on.
  state.run.artifacts = ['quantum'];
  state.run.editions = { quantum: 'overclocked' };
  state.run.enemy = null;
  beginNode();
  state.run.enemy.hp = state.run.enemy.max = 1e9;
  rollDice();
  settle();
  setFaces([4, 4, 4, 4, 4]);
  await executePayload();
  // 20 bits, mult (1 + 4 from OVERCLOCKED) x2 from QUANTUM CORE = 200.
  check('an overclocked artifact pays its rider', state.run.stats.biggest, 200);

  state.run.editions = { quantum: 'prismatic' };
  state.run.phase = 'ready';
  rollDice();
  settle();
  setFaces([4, 4, 4, 4, 4]);
  await executePayload();
  // 20 bits x2 from QUANTUM CORE x1.5 from PRISMATIC = 60, where the same
  // artifact stamped OVERCLOCKED landed 200: a flat rider is worth more than a
  // multiplying one until the rest of the rig has some Mult to multiply.
  check('a prismatic rider multiplies last',
    Number(els.power.textContent.replace(/,/g, '')), 60);

  section('Boss protocols');
  startNewRun();
  state.run.enemy.boss = 'antivirus';
  rollDice();
  settle();
  check('antivirus quarantines one', board.dice.filter(die => die.quarantined).length, 1);

  state.run.enemy.boss = 'watchdog';
  board.dice.forEach(die => { die.quarantined = false; });
  setFaces([2]);
  refreshPreview();
  check('watchdog absorbs low dice', els.bits.textContent, '0');
  setFaces([6]);
  refreshPreview();
  check('watchdog spares high dice', els.bits.textContent, String(6 * board.dice.length));

  state.run.enemy.boss = 'encryption';
  state.run.enemy.hp = state.run.enemy.max = 1e6;
  state.run.executes = state.run.maxExecutes = 4;
  setFaces([1, 2, 3, 4, 5]); // no pair: the cipher shield holds
  const beforeCipher = state.run.stats.dmg;
  await executePayload();
  check('cipher shield absorbs 90%', state.run.stats.dmg - beforeCipher, Math.floor(15 * 0.1));

  section('The boss cutscene');
  startNewRun({ handle: 'ANON', difficulty: 'pen-tester', seed: 'CUT-1' });
  check('an ordinary node has no cutscene', isCutsceneOpen(), false);

  state.run.node = 5;
  beginNode();
  check('a protocol introduces itself', isCutsceneOpen(), true);
  check('it names the boss', els.cutName.textContent, BOSSES[state.run.enemy.boss].name);
  check('and states the rule it will enforce', els.cutRule.textContent, BOSSES[state.run.enemy.boss].rule);
  check('it says something of its own', els.cutLine.textContent.length > 0, true);

  closeCutscene();
  check('and it can be dismissed', isCutsceneOpen(), false);

  section('The other boss protocols');

  // RATE LIMITER: only the best three dice are allowed to score.
  state.run.enemy.boss = 'throttle';
  state.run.enemy.hp = state.run.enemy.max = 1e6;
  state.run.executes = state.run.maxExecutes = 4;
  state.run.phase = 'ready';
  rollDice();
  settle();
  setFaces([6, 5, 4, 3, 2]);
  refreshPreview();
  check('rate limiter scores only the best three', els.bits.textContent, '15');

  // PROXY WRAITH: rebuilds its firewall after every execute.
  state.run.enemy.boss = 'wraith';
  state.run.enemy.hp = 500000;
  const beforeRegen = state.run.enemy.hp;
  setFaces([1, 1, 1, 1, 1]); // a scratch, so the regen is what moves the bar
  await executePayload();
  check('proxy wraith rebuilds its firewall', state.run.enemy.hp > beforeRegen, true);

  // RANSOMWARE VAULT: pays out of your scrap, or hardens.
  state.run.enemy.boss = 'ransomware';
  state.run.enemy.hp = state.run.enemy.max = 1e6;
  state.run.scrap = 10;
  state.run.executes = state.run.maxExecutes = 4;
  state.run.phase = 'ready';
  rollDice();
  settle();
  setFaces([5, 5, 5, 5, 5]);
  const beforePaid = state.run.stats.dmg;
  await executePayload();
  check('ransomware takes its fee', state.run.scrap, 7);
  check('a paid execute lands in full', state.run.stats.dmg - beforePaid, 25);

  state.run.scrap = 0;
  state.run.phase = 'ready';
  rollDice();
  settle();
  setFaces([5, 5, 5, 5, 5]);
  const beforeUnpaid = state.run.stats.dmg;
  await executePayload();
  check('an unpaid execute is halved', state.run.stats.dmg - beforeUnpaid, 12);

  // SANDBOX: no charges on this node.
  state.run.abilities = ['bitshift'];
  state.run.charges = { bitshift: 1 };
  state.run.enemy.boss = 'sandbox';
  bossOnNodeStart();
  check('sandbox contains your abilities', state.run.charges.bitshift, 0);

  // REVENANT: refuses the first killing blow.
  state.run.enemy.boss = 'revenant';
  state.run.enemy.max = 1000;
  state.run.enemy.hp = 1;
  state.run.enemy.restored = false;
  state.run.executes = state.run.maxExecutes = 4;
  state.run.phase = 'ready';
  rollDice();
  settle();
  await executePayload();
  check('revenant refuses the first breach', state.run.enemy.hp, 400);
  check('and the node carries on', state.run.phase, 'ready');

  state.run.enemy.hp = 1;
  rollDice();
  settle();
  await executePayload();
  check('the second time it stays down', state.run.phase, 'shop');

  // Leave a clean, live node for the section that follows.
  startNewRun({ handle: 'ANON', difficulty: 'pen-tester' });
  state.run.enemy.hp = state.run.enemy.max = 1e6;

  section('Losing, and moving up');
  state.run.executes = 1;
  state.run.phase = 'ready';
  rollDice();
  settle();
  await executePayload();
  check('trace ends the run', state.run.phase, 'over');
  check('save was cleared', loadSavedRun(), null);

  startNewRun({ handle: 'ANON', difficulty: 'pen-tester', seed: 'MIGRATE' });
  state.run.node = 5;
  beginNode();
  check('node five is a boss', !!state.run.enemy.boss, true);
  check('boss rule is shown', els.bossRule.textContent.length > 0, true);

  // Which protocol guards it comes from the seed, and the protocols have their
  // own section. Migration is what is under test here, so pin a boss that does
  // not refuse a killing blow or rebuild itself afterwards — otherwise this
  // passes or fails on whichever one the seed dealt.
  state.run.enemy.boss = 'antivirus';
  state.run.enemy.hp = 1;
  rollDice();
  settle();
  setFaces([6, 6, 6, 6, 6]);
  await executePayload();
  check('migrated up a server', state.run.server, 2);
  check('back to node one', state.run.node, 1);
  check('opens in the market', state.run.phase, 'shop');

  section('Special dice, abilities and the leak');
  startNewRun();
  state.run.dice = ['virus', 'amp', 'qubit', 'mirror', 'd12'];
  board.setDicePool(state.run.dice);
  state.run.artifacts = ['overclock', 'brute', 'quantum', 'recursive', 'memleak'];
  state.run.abilities = ['bitshift', 'overdrive', 'rootkit'];
  state.run.charges = { bitshift: 1, overdrive: 1, rootkit: 1 };
  state.run.enemy.hp = state.run.enemy.max = 1e9;

  rollDice();
  settle();
  board.dice.forEach(die => { die.value = die.shownValue = die.type === 'd12' ? 11 : 5; });
  useAbility('bitshift');
  check('bit shift raised every die', board.dice.every(die => die.value === (die.type === 'd12' ? 12 : 6)), true);
  check('bit shift spent its charge', state.run.charges.bitshift, 0);
  useAbility('overdrive');
  check('overdrive is armed', state.run.overdrive, 2);
  useAbility('rootkit');
  check('rootkit added an execute', state.run.executes, 5);

  const beforeRig = state.run.stats.dmg;
  await executePayload();
  check('special dice scored', state.run.stats.dmg > beforeRig, true);
  check('multipliers stacked up', Number(els.mult.textContent) > 1, true);
  check('overdrive was consumed', state.run.overdrive, 1);
  check('memory leak is draining', isLeakDraining(), true);
  const hpBeforeLeak = state.run.enemy.hp;

  // The bar has to come down as the leak drains, not sit still and jump at the
  // end: a stepped transition restarted every frame never advances a step.
  state.run.phase = 'ready';
  const widthBeforeLeak = els.firewallFill.style.width;
  for (let i = 0; i < 40; i++) tickMemoryLeak(0.05);

  check('memory leak drains the firewall', state.run.enemy.hp < hpBeforeLeak, true);
  check('a draining bar drops its transition',
    els.firewallBar.classList.contains('draining'), true);
  check('and the fill came down with it',
    els.firewallFill.style.width !== widthBeforeLeak, true);

  // An ordinary hit still animates, so a big one reads as a chunk taken out.
  updateUI();
  check('an ordinary update animates again',
    els.firewallBar.classList.contains('draining'), false);

  state.run.phase = 'shop';
  sellItem('art', 0);
  check('sold an artifact', state.run.artifacts.length, 4);
  sellItem('abil', 0);
  check('sold an ability', state.run.abilities.length, 2);

  section('It reads as a game, not a page');
  state.run.artifacts = ['quantum', 'botnet', 'brute'];
  updateUI();
  const styleOf = (el, prop) => getComputedStyle(el).getPropertyValue(prop).trim();

  for (const [what, el] of [
    ['the artifact row', els.artifactRow],
    ['a slot', els.artifactRow.querySelector('.art[data-id]')],
    ['the console log', els.log],
    ['the scoreboard', els.bits],
    ['the toolkit', els.toolkit],
  ]) check(what + ' cannot be selected', styleOf(el, 'user-select'), 'none');

  check('sprites cannot be dragged off the page',
    styleOf(els.artifactRow.querySelector('.art img'), '-webkit-user-drag'), 'none');
  check('and neither can the board', styleOf(els.boardCanvas, '-webkit-user-drag'), 'none');
  check('taps do not flash',
    styleOf(document.documentElement, '-webkit-tap-highlight-color'), 'rgba(0, 0, 0, 0)');

  // A native drag is refused outright, which is what Firefox needs.
  const refusesDrag = el => {
    const event = new Event('dragstart', { bubbles: true, cancelable: true });
    el.dispatchEvent(event);
    return event.defaultPrevented;
  };
  check('an image will not start a drag',
    refusesDrag(els.artifactRow.querySelector('.art img')), true);

  section('Artifact order');
  startNewRun({ handle: 'ANON', difficulty: 'pen-tester', seed: 'ORDER-1' });

  // BOTNET is +1 Mult per die, QUANTUM CORE is x2. Five d6 showing 4 = 20 bits.
  async function damageWith(order) {
    state.run.artifacts = [...order];
    state.run.editions = {};
    state.run.dice = ['d6', 'd6', 'd6', 'd6', 'd6'];
    board.setDicePool(state.run.dice);
    state.run.enemy.hp = state.run.enemy.max = 1e9;
    state.run.executes = state.run.maxExecutes = 9;
    state.run.phase = 'ready';
    rollDice();
    settle();
    setFaces([4]);
    const before = state.run.stats.dmg;
    await executePayload();
    return state.run.stats.dmg - before;
  }

  // Each slot finishes before the next starts, so +Mult only gets multiplied
  // by the xMult sitting to its right.
  check('flat before times pays 20 x (1+5) x2', await damageWith(['botnet', 'quantum']), 240);
  check('times before flat pays 20 x ((1x2)+5)', await damageWith(['quantum', 'botnet']), 140);
  check('a third artifact follows the same rule',
    await damageWith(['brute', 'botnet', 'quantum']), 45 * 6 * 2);

  state.run.artifacts = ['quantum', 'botnet'];
  reorderArtifacts(['botnet', 'quantum']);
  check('reordering applies', state.run.artifacts, ['botnet', 'quantum']);
  reorderArtifacts(['botnet']);
  check('a partial order keeps what it did not mention',
    state.run.artifacts, ['botnet', 'quantum']);
  reorderArtifacts(['ghost', 'quantum', 'botnet']);
  check('and an order naming what is not installed is ignored',
    state.run.artifacts, ['quantum', 'botnet']);

  // Dragging the row is how a player does it.
  state.run.artifacts = ['quantum', 'botnet', 'brute'];
  updateUI();
  const slotIds = () => [...els.artifactRow.querySelectorAll('.art[data-id]')].map(el => el.dataset.id);
  const pointer = (type, x, y) => new PointerEvent(type,
    { clientX: x, clientY: y, bubbles: true, pointerId: 1, button: 0, isPrimary: true });
  const slotBox = i => els.artifactRow.querySelectorAll('.art')[i].getBoundingClientRect();

  getSelection().removeAllRanges();
  const first = slotBox(0);
  const last = slotBox(2);
  const alongY = first.top + first.height / 2;
  els.artifactRow.querySelector('.art[data-id]')
    .dispatchEvent(pointer('pointerdown', first.left + first.width / 2, alongY));
  els.artifactRow.dispatchEvent(pointer('pointermove', first.left + first.width / 2 + 3, alongY + 1));
  check('a press that barely moves stays a tap', isDraggingArtifacts(), false);

  els.artifactRow.dispatchEvent(pointer('pointermove', last.left + last.width - 2, alongY));
  check('a real move becomes a drag', isDraggingArtifacts(), true);
  check('and the row reorders under the pointer', slotIds(), ['botnet', 'brute', 'quantum']);

  els.artifactRow.dispatchEvent(pointer('pointerup', last.left + last.width - 2, alongY));
  check('dropping it reorders the rig', state.run.artifacts, ['botnet', 'brute', 'quantum']);
  check('and the drag highlighted nothing', getSelection().toString(), '');
  check('the drop is not also a tap', justDragged(), true);
  check('and a repaint keeps the order', (updateUI(), slotIds()), ['botnet', 'brute', 'quantum']);

  section('The archive');
  archive.forgetAll();
  check('a fresh device has met nothing',
    archive.ARCHIVE_SECTIONS.map(s => archive.progressOf(s).seen), [0, 0, 0, 0]);

  startNewRun({ handle: 'ANON', difficulty: 'pen-tester', seed: 'ARCHIVE-1' });
  check('the pool it starts with counts', archive.isDiscovered('die', 'd6'), true);
  check('and nothing it has not seen does', archive.isDiscovered('die', 'd20'), false);

  // Being offered something is meeting it, whether or not it is bought.
  state.run.phase = 'shop';
  state.run.scrap = 0;
  generateShop();
  check('every offer is archived',
    state.run.shop.every(item => archive.isDiscovered(item.kind, item.id)), true);

  const archived = archiveHTML();
  check('found entries are named', archived.includes('D6 STANDARD'), true);
  check('and the rest are a blank', archived.includes('UNKNOWN'), true);
  check('which does not name them', archived.includes('MOORE'), false);

  archive.revealAll();
  check('revealing fills every section',
    archive.ARCHIVE_SECTIONS.every(s => {
      const progress = archive.progressOf(s);
      return progress.seen === progress.total;
    }), true);
  check('and leaves no blanks on the screen', archiveHTML().includes('UNKNOWN'), false);
  archive.forgetAll();

  section('Saving and resuming');
  state.run.phase = 'ready';
  state.run.server = 3;
  state.run.node = 4;
  state.run.scrap = 42;
  saveRun();
  const saved = loadSavedRun();
  check('save recorded progress', [saved.server, saved.node, saved.scrap], [3, 4, 42]);
  resumeRun(saved);
  check('resumed the server', state.run.server, 3);
  check('resumed into a node', state.run.phase, 'ready');
  check('resumed enemy exists', !!state.run.enemy, true);

  state.run.artifacts = ['quantum', 'cache'];
  state.run.editions = { quantum: 'prismatic', cache: 'negative' };
  saveRun();
  resumeRun(loadSavedRun());
  check('editions survive a save', state.run.editions,
    { quantum: 'prismatic', cache: 'negative' });
  check('and the slot they brought with them', artifactSlots(), 6);

  state.run.phase = 'shop';
  saveRun();
  resumeRun(loadSavedRun());
  check('a market save resumes in the market', state.run.phase, 'shop');
  check('market has offers', state.run.shop.length > 0, true);

  resumeRun({
    v: 1, server: 1, node: 1, scrap: 5,
    dice: ['d6', 'nonsense'], artifacts: ['ghost', 'bogus'], abilities: ['nope'],
    stacks: {}, editions: { bogus: 'prismatic', ghost: 'holographic' },
    stats: { dmg: 0, nodes: 0, biggest: 0 }, at: 'node', shop: [],
  });
  check('unknown dice dropped', state.run.dice, ['d6', 'd6', 'd6']);
  check('unknown artifacts dropped', state.run.artifacts, ['ghost']);
  check('unknown abilities dropped', state.run.abilities, []);
  check('editions for dropped artifacts go too', state.run.editions, {});
  check('ghost protocol grants an execute', state.run.executes, 5);

  say(failures ? `${failures} FAILURE(S)` : 'ALL CHECKS PASSED',
    (failures ? 'fail' : 'pass') + ' total');
} catch (error) {
  // Firefox leaves the message out of .stack, so print both.
  say(`THREW: ${error && error.message ? error.message + ' — ' : ''}${(error && error.stack) || error}`, 'fail');
} finally {
  restoreStorage();
  if (ping) await Promise.all(sent);
}
</script>
</body>
</html>
