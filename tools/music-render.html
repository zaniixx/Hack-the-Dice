<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hack the Dice — soundtrack render</title>
<style>
  body { background:#0b0a14; color:#dfe6ff; font:13px/1.7 ui-monospace, monospace; padding:14px; }
  h1 { font-size:14px; color:#3df2ff; margin:0 0 8px; }
  a { color:#b6ff3d; }
  .row { margin: 6px 0; }
</style>
</head>
<body>
<h1>Hack the Dice — soundtrack render</h1>
<div id="out">rendering…</div>

<script type="module">
/*
 * Renders the soundtrack to a WAV so it can be listened to.
 *
 * The music is generated rather than sampled, which makes it the one part of
 * the game that cannot be judged by reading it. The smoke suite can prove the
 * arrangement is long and that the layers switch in the right order; it cannot
 * tell anybody whether the result is pleasant, and the complaint that caused
 * the rewrite — that the old loop was irritating — was never going to be
 * answered by an assertion.
 *
 * So this renders real samples offline, which works in a headless browser
 * where live playback does not: a browser with no sound card never starts its
 * audio clock, so nothing is heard and nothing is measurable, but an
 * OfflineAudioContext still produces the numbers.
 *
 * Open it and click a link to listen. With ?post it uploads each excerpt to
 * tools/capture_server.py instead, which is how it is checked from a terminal:
 *
 *   python3 tools/capture_server.py . press/music 8712
 *   chrome --headless "http://127.0.0.1:8712/tools/music-render.html?post"
 */
import { initAudio, setMuted } from '../src/audio/synth.js';
import {
  setMood, setIntensity, renderBars, stopMusic, currentMood, currentIntensity,
} from '../src/audio/music.js';

const SR = 44100;
const out = document.getElementById('out');
const post = location.search.includes('post');

/*
 * One excerpt each of the things worth hearing: a mood at rest, the same mood
 * under pressure, and the two ends of the run. Sixteen bars because the point
 * being demonstrated is that it does not repeat, and a four-bar excerpt could
 * not show that either way.
 */
const TAKES = [
  { name: 'node-calm', mood: 'node', intensity: 0.58, bars: 16 },
  { name: 'node-pressed', mood: 'node', intensity: 0.95, bars: 16 },
  { name: 'boss', mood: 'boss', intensity: 0.8, bars: 16 },
  { name: 'menu', mood: 'menu', intensity: 0.3, bars: 16 },
  { name: 'danger', mood: 'danger', intensity: 0.95, bars: 16 },
];

/** A mono 16-bit WAV, so the result is something any player can open. */
function toWav(samples) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const ascii = (at, text) => [...text].forEach((ch, i) => view.setUint8(at + i, ch.charCodeAt(0)));

  ascii(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  ascii(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, SR, true);
  view.setUint32(28, SR * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  ascii(36, 'data');
  view.setUint32(40, samples.length * 2, true);

  for (let i = 0; i < samples.length; i++) {
    const clamped = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, clamped * 32767, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

for (const [index, take] of TAKES.entries()) {
  // A fresh context per take, because the synth holds on to the one it is given
  // and a take has to start from silence.
  const offline = new OfflineAudioContext(1, Math.ceil(SR * 90), SR);
  initAudio(offline);
  setMuted(false);

  /*
   * Stop the live sequencer before writing anything.
   *
   * setMood() starts it, and its timer goes on firing between takes — into
   * whichever context the synth was last handed, easing the intensity towards
   * its target a bar at a time as it goes. The first version of this file left
   * it running, and every excerpt came out at an intensity somewhere between
   * the one it asked for and the one before it.
   */
  setMood(take.mood);
  stopMusic();
  setIntensity(take.intensity);
  const seconds = renderBars(take.bars, 0.01);

  const rendered = await offline.startRendering();
  const samples = rendered.getChannelData(0).slice(0, Math.ceil(SR * (seconds + 1)));

  let peak = 0;
  let sum = 0;
  for (const value of samples) {
    peak = Math.max(peak, Math.abs(value));
    sum += value * value;
  }
  const rms = Math.sqrt(sum / samples.length);

  const blob = toWav(samples);
  const line = `${take.name} — ${currentMood()} at ${take.intensity}, `
    + `${take.bars} bars, ${seconds.toFixed(1)}s, rendered at ${currentIntensity()}, `
    + `peak ${peak.toFixed(3)}, rms ${rms.toFixed(4)}`;

  if (post) {
    await fetch('/frame/' + index, { method: 'POST', body: blob });
    out.insertAdjacentHTML('beforeend', `<div class="row">${line}</div>`);
  } else {
    const url = URL.createObjectURL(blob);
    out.insertAdjacentHTML('beforeend',
      `<div class="row"><a href="${url}" download="${take.name}.wav">${line}</a></div>`);
  }
}

document.title = 'READY';
</script>
</body>
</html>
