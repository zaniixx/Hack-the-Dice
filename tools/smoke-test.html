<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hack the Dice — smoke test</title>
<style>
  body { background:#0b0a14; color:#dfe6ff; font:14px/1.5 ui-monospace, monospace; padding:16px; }
  .pass { color:#b6ff3d; }
  .fail { color:#ff4d6d; font-weight:bold; }
  h1 { font-size:16px; color:#3df2ff; }
</style>
</head>
<body>
<h1>Hack the Dice — module smoke test</h1>
<div id="out">running...</div>

<!--
  Point the game at a board of our own before any module loads.

  This has to be a plain script, not the module below: `import` declarations
  hoist, so src/services/config.js — which reads the board URL once, at load —
  would otherwise have already taken the real one, and this suite would write
  its test scores to the live leaderboard. It did exactly that once.
-->
<script>localStorage.setItem('htd_api_base', 'http://fake-board.test');</script>

<script type="module">
/*
 * Loads every module that does not need the game's markup and checks the rules
 * they encode. Open it through a static server; a green list means the module
 * graph is sound and the maths still says what it said. Append ?ping to mirror
 * the result to the server log for headless runs.
 */
import { fmt, fmtM } from '../src/core/format.js';
import { clamp } from '../src/core/math.js';
import { countPairs, longestStraight } from '../src/data/combos.js';
import { ARTIFACTS } from '../src/data/artifacts.js';
import { ABILITIES } from '../src/data/abilities.js';
import { definitionOf, idsOf, ItemKind } from '../src/data/catalog.js';
import { MAX_TIER } from '../src/data/rules.js';
import { ICON_PATTERNS } from '../src/data/icons.js';
import {
  LOGO_TEXT, LOGO_GLYPHS, GLYPH_JUNK, GLYPH_WIDTH, GLYPH_HEIGHT, layoutLogo,
} from '../src/data/logo-font.js';
import { LOGO_PALETTES, randomPalette } from '../src/render/logo-view.js';
import { nodeHP, serverScale, SERVER_STEP, SERVER_ACCEL } from '../src/data/enemies.js';
import { EDITIONS, isKnownEdition, editionChance, slotsFrom } from '../src/data/editions.js';
import { BOSSES, BOSS_ORDER, bossForServer, bossOrderFor } from '../src/data/bosses.js';
import { CORPS, corpName, corpFor } from '../src/data/corps.js';
import { ENEMY_SPRITES } from '../src/render/enemy-sprites.js';
import { applyScoringValues, comboTags, isAbsorbed } from '../src/game/scoring.js';
import { dieSprite, dieIconURL, BLANK_FACE } from '../src/render/die-sprites.js';
import { JUNK_BODIES } from '../src/render/junk-sprites.js';
import { DICE, mirrorSource, faceCapFor } from '../src/data/dice.js';
import { iconURL } from '../src/render/icon-sprites.js';
import * as board from '../src/engine/dice-board.js';
import { DIFFICULTIES, DIFFICULTY_ORDER, difficultyOf, difficultySummary } from '../src/data/difficulty.js';
import { runScore } from '../src/game/score.js';
import {
  createTournament, decodeTournament, isOpCode,
} from '../src/game/tournament.js';
import {
  seedRun, restoreRng, rngState, gameInt, normaliseSeed, randomSeed,
} from '../src/core/game-random.js';
import { qrMatrix, formatBits } from '../src/render/qr.js';
import { compareEntries, store, storeScope } from '../src/services/store.js';
import {
  localStore, knownTournamentIds, rememberTournament, forgetTournament,
} from '../src/services/local-store.js';
import { remoteStore } from '../src/services/remote-store.js';
import * as ops from '../src/services/root-api.js';
import { hasRemoteBoard, API_BASE } from '../src/services/config.js';
import {
  settings, saveSettings, setSetting, resetSettings, cycleSpeed, toggleMuted,
  DEFAULTS, SPEEDS, SCALE_MIN, SCALE_MAX,
} from '../src/core/settings.js';
import { maxUiScale, uiScale, TOUCH_WIDTH } from '../src/ui/viewport.js';
import { binds, ACTIONS, ACTION_IDS, RESERVED, keyLabel } from '../src/core/keybinds.js';
import { ACHIEVEMENTS, ACHIEVEMENT_IDS, Moment, dueAt } from '../src/data/achievements.js';
import { buildLabel } from '../src/services/build-info.js';
import { moodFor } from '../src/game/soundtrack.js';
import { sfx } from '../src/audio/sfx.js';
import { initAudio, setMuted } from '../src/audio/synth.js';

import { installFakeBoard, FAKE_BOARD_URL, FAKE_ADMIN_KEY } from './fake-board.js';

/** Serves the board this suite was pointed at, in memory. */
const fakeBoard = installFakeBoard();

const out = document.getElementById('out');
let failures = 0;

function check(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (!ok) failures++;
  out.insertAdjacentHTML('beforeend',
    `<div class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'} ${name}` +
    (ok ? '' : ` &mdash; got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`) + '</div>');
}

try {
  out.innerHTML = '';

  check('fmt small', fmt(1234), '1,234');
  check('fmt millions', fmt(1234567), '1.23M');
  check('fmt infinite', fmt(Infinity), '\u221e');
  check('fmtM fraction', fmtM(1.755), '1.76');
  check('clamp', clamp(12, 0, 10), 10);

  check('countPairs', countPairs([1, 1, 2, 2, 2, 5]), 2);
  check('longestStraight', longestStraight([4, 2, 3, 6, 5]), 5);
  check('comboTags', comboTags([4, 4, 5, 6, 7]), ['PAIR', 'RUN OF 4', 'ALL 4+']);

  check('catalog sizes',
    [idsOf(ItemKind.DIE).length, idsOf(ItemKind.ARTIFACT).length, idsOf(ItemKind.ABILITY).length],
    [19, 27, 15]);

  // Every tier up to the last has to have something in it, in all three
  // catalogs, or a server that unlocks a tier unlocks nothing.
  const tiersIn = catalog => [...new Set(Object.values(catalog).map(def => def.tier))].sort();
  check('dice reach the top tier', tiersIn(DICE), [1, 2, 3, 4]);
  check('abilities reach it too', tiersIn(ABILITIES), [1, 2, 3, 4]);
  check('the market stocks no higher than the catalogs go',
    Math.max(...Object.values(DICE).map(d => d.tier),
      ...Object.values(ABILITIES).map(a => a.tier),
      ...Object.values(ARTIFACTS).map(a => a.tier)), MAX_TIER);
  check('a deeper tier always costs more',
    [1, 2, 3].every(tier => {
      const below = Object.values(DICE).filter(d => d.tier === tier).map(d => d.cost);
      const above = Object.values(DICE).filter(d => d.tier === tier + 1).map(d => d.cost);
      return Math.max(...below) < Math.max(...above);
    }), true);
  check('every ability has an icon',
    Object.keys(ABILITIES).every(id => ICON_PATTERNS[id]), true);
  check('a die that scores twice says so',
    Object.values(DICE).filter(d => d.retriggers).map(d => d.name), ['CHRONO DIE']);
  check('definitionOf', definitionOf({ kind: 'art', id: 'quantum' }).name, 'QUANTUM CORE');
  check('definitionOf unknown', definitionOf({ kind: 'nope', id: 'x' }), undefined);

  /*
   * Found junk.
   *
   * These are the items whose whole identity is that they do not roll 1..faces
   * like everything else, so what is worth pinning is the range each one can
   * actually produce — a TOSSED COIN that ever lands on 3 is not a coin.
   */
  const rolledRange = (id, samples = 600) => {
    const def = DICE[id];
    const seen = new Set();
    seedRun('JUNK-' + id);
    for (let i = 0; i < samples; i++) {
      const die = { type: id, value: 0 };
      seen.add(def.roll ? def.roll(die, def.faces, gameInt) : gameInt(1, def.faces));
    }
    return [...seen].sort((a, b) => a - b);
  };

  check('a tossed coin lands on 1 or 6 and nothing else', rolledRange('coin'), [1, 6]);
  check('a loaded die never disappoints', rolledRange('loaded'), [4, 5, 6]);
  check('a lego brick is a d4', rolledRange('lego'), [1, 2, 3, 4]);
  check('gum can only ever go up', (() => {
    const def = DICE.gum;
    seedRun('GUM');
    // A die already showing 5 cannot be rerolled down to a 2.
    return [...Array(200)].every(() => def.roll({ type: 'gum', value: 5 }, 6, gameInt) >= 5);
  })(), true);
  check('a lego 1 is the roll that pays',
    [DICE.lego.onScore({ scoringValue: 1 }).length, DICE.lego.onScore({ scoringValue: 4 }).length],
    [1, 0]);
  check('fuzzy dice are there for the Mult, not the Bits',
    [!!DICE.fuzzy.noBits, DICE.fuzzy.onScore()[0].value], [true, 6]);

  // A battery is the only die that wears, and it has to reach exactly zero.
  check('a battery loses a face a node and then is nothing',
    [0, 1, 5, 9, 10, 40].map(wear => faceCapFor('battery', wear)), [10, 9, 5, 1, 0, 0]);
  check('nothing else wears at all',
    [0, 50].map(wear => faceCapFor('d20', wear)), [20, 20]);

  // And the junk artifacts, which are all arithmetic over the run.
  const asRun = extra => ({ run: { scrap: 0, dice: [], node: 1, stacks: {}, ...extra }, scored: [] });
  const paid = (id, ctx) => (ARTIFACTS[id].bonus(ctx)[0] || { value: 0 }).value;

  check('the paperclip is +1 Mult and nothing else',
    [paid('paperclip', asRun()), Object.keys(ARTIFACTS.paperclip).includes('perDie')], [1, false]);
  check('the duck pays per reroll actually spent',
    [0, 1, 3].map(spent => paid('duck', asRun({ rerollsSpent: spent }))), [0, 2, 6]);
  check('tangled cables are worth nothing on the node you buy them',
    [1, 2, 5].map(node => paid('cables', asRun({ node }))), [0, 4, 16]);
  check('coffee goes cold and stops at nothing',
    [0, 3, 8, 20].map(cold => paid('coffee', asRun({ stacks: { coffee: cold } }))), [8, 5, 0, 0]);
  check('the energy drink stops paying after three nodes',
    [0, 2, 3, 9].map(nodes =>
      ARTIFACTS.energydrink.multiplier({ run: { stacks: { energydrink: nodes } } }).length),
    [1, 1, 0, 0]);
  check('and the floppy caps Bits somewhere a real pool can reach',
    ARTIFACTS.floppy.capsBits < 600, true);

  /*
   * The junk draws itself.
   *
   * A coin drawn as a tinted cube is a cube, so these six bring their own
   * 16x16. Two things can break quietly: one of them losing its painter and
   * silently falling back to a cube, and the sprite cache forgetting that a
   * battery's look depends on its charge — at which point every battery in the
   * run shares one sprite and the charge bar never moves again.
   */
  const JUNK = ['coin', 'battery', 'lego', 'gum', 'loaded', 'fuzzy'];
  check('every piece of junk paints itself rather than borrowing a cube',
    JUNK.every(id => typeof JUNK_BODIES[id] === 'function'), true);
  check('and nothing else does',
    Object.keys(JUNK_BODIES).filter(id => !JUNK.includes(id)), []);
  check('a battery at full charge is not the sprite of a flat one',
    dieSprite('battery', 5, 10) !== dieSprite('battery', 5, 4), true);
  check('but the same battery twice is the same sprite',
    dieSprite('battery', 5, 10) === dieSprite('battery', 5, 10), true);
  check('a die that cannot wear ignores the charge entirely',
    dieSprite('d6', 5, 2) === dieSprite('d6', 5, 6), true);
  check('the market never advertises a face a die cannot roll',
    DICE.coin.iconFace, 6);

  /*
   * The wordmark.
   *
   * It is drawn a pixel at a time, so the grid has to be exact: a glyph one row
   * short draws a letter with its feet cut off, and a junk glyph of the wrong
   * size tears a hole in the word every time the corruption swaps one in. Both
   * would look like the effect rather than like a mistake, which is exactly why
   * they are worth pinning.
   */
  const everyGlyph = [...Object.values(LOGO_GLYPHS), ...GLYPH_JUNK];
  check('every letter of the title has a glyph',
    [...LOGO_TEXT].filter(ch => ch !== ' ').every(ch => LOGO_GLYPHS[ch]), true);
  check('and no glyph is drawn that the title never uses',
    Object.keys(LOGO_GLYPHS).filter(ch => !LOGO_TEXT.includes(ch)), []);
  check('every glyph is the same height',
    everyGlyph.every(rows => rows.length === GLYPH_HEIGHT), true);
  check('and the same width, junk included',
    everyGlyph.every(rows => rows.every(row => row.length === GLYPH_WIDTH)), true);
  check('glyphs are made of set and unset cells and nothing else',
    everyGlyph.every(rows => rows.every(row => /^[#.]+$/.test(row))), true);

  const laid = layoutLogo();
  check('the layout places one cell per letter, spaces aside',
    laid.cells.length, [...LOGO_TEXT].filter(ch => ch !== ' ').length);
  check('laid out left to right without overlapping',
    laid.cells.every((cell, i) => i === 0 || cell.x >= laid.cells[i - 1].x + GLYPH_WIDTH), true);
  check('and the reported width reaches the last letter',
    laid.width, laid.cells.at(-1).x + GLYPH_WIDTH);

  /*
   * The title takes one of its palettes at random every time it is put on
   * screen, so what matters is that they are all usable: a palette missing a
   * colour draws part of the wordmark as `undefined`, which canvas quietly
   * ignores — the letters simply lose a fringe and nobody is told why.
   */
  const paletteNames = Object.keys(LOGO_PALETTES);
  check('there is more than one palette to choose between', paletteNames.length > 1, true);
  check('and every one of them is complete',
    paletteNames.every(name => {
      const p = LOGO_PALETTES[name];
      return ['left', 'right', 'ink'].every(k => /^#[0-9a-f]{6}$/i.test(p[k] || ''));
    }), true);
  // Rolled once per attempt, not once per comparison — rolling inside the
  // search means comparing forty palettes against forty different rolls.
  check('a palette always comes back, and always a real one',
    [...Array(40)].every(() => {
      const rolled = randomPalette();
      return paletteNames.some(name => LOGO_PALETTES[name] === rolled);
    }), true);
  check('and over enough rolls it is not always the same one',
    new Set([...Array(80)].map(() => randomPalette().left)).size > 1, true);

  check('nodeHP first node', nodeHP(1, 1), 40);
  check('nodeHP boss', nodeHP(1, 5), Math.round(40 * Math.pow(1.55, 4) * 2.2));
  check('nodeHP server 2', nodeHP(2, 1), Math.round(40 * SERVER_STEP));

  // The firewall curve has to accelerate, not just climb: each server's step up
  // must be bigger than the one before it, or a compounding rig outgrows it.
  const steps = [2, 3, 4, 5, 6, 7].map(s => serverScale(s) / serverScale(s - 1));
  check('each server steps up by more than the last one did',
    steps.every((step, i) => i === 0 || step > steps[i - 1]), true);
  check('the step widens by SERVER_ACCEL', steps[1] / steps[0], SERVER_ACCEL);
  check('server 1 is still the tutorial it was', [nodeHP(1, 1), nodeHP(1, 5)], [40, 508]);
  check('corpName wraps', corpName(7), 'OMNIDYNE MK2');
  // Boss order is drawn from the run's seed, so a second run of the same seed
  // meets the same protocols in the same places and a different seed does not.
  const lap = seed => [1, 2, 3, 4, 5, 6, 7, 8].map(s => bossForServer(s, seed));
  check('a seed decides the boss order', lap('ABC123'), lap('ABC123'));
  check('a different seed gets a different order',
    lap('ABC123').join() !== lap('RACE1').join(), true);
  check('every protocol is met once before any is met twice',
    new Set(lap('ABC123')).size, BOSS_ORDER.length);
  check('the second lap is not a repeat of the first',
    [9, 10, 11, 12, 13, 14, 15, 16].map(s => bossForServer(s, 'ABC123')).join()
      !== lap('ABC123').join(), true);
  check('an order is a permutation of the catalog',
    [...bossOrderFor('ABC123')].sort(), [...BOSS_ORDER].sort());
  check('a blank seed still gives a whole lap',
    new Set(lap('')).size, BOSS_ORDER.length);

  // Every boss has to be playable: a rule to read, and a face to show.
  check('there are eight bosses', BOSS_ORDER.length, 8);
  check('every boss states its rule',
    BOSS_ORDER.every(id => BOSSES[id].rule.length > 20), true);
  check('every boss has a sprite painter',
    BOSS_ORDER.every(id => typeof ENEMY_SPRITES[BOSSES[id].sprite] === 'function'), true);
  check('every boss enforces something',
    BOSS_ORDER.every(id => ['onNodeStart', 'onSettled', 'absorbs', 'scoringDice',
      'multiplier', 'afterExecute', 'survivesBreach'].some(hook => BOSSES[id][hook])), true);

  // Rate limiter keeps the best three, whatever order they arrive in.
  const throttled = BOSSES.throttle.scoringDice(
    [2, 6, 4, 1, 5].map(v => ({ scoringValue: v })));
  check('rate limiter keeps the best three',
    throttled.map(die => die.scoringValue), [6, 5, 4]);

  // Every corp is a character, with somewhere to put the words.
  const EVENTS = ['greet', 'weak', 'hurt', 'breach', 'owned', 'traced'];
  check('six corporations', CORPS.length, 6);
  check('every corp has a full voice',
    CORPS.every(corp => EVENTS.every(event => corp.voice[event] && corp.voice[event].length)), true);
  check('every corp names its own nodes',
    CORPS.every(corp => corp.nodes.length >= 6), true);
  check('every corp has a tagline and a colour',
    CORPS.every(corp => corp.tagline && /^#[0-9a-f]{6}$/i.test(corp.color)), true);
  check('servers map to corps', corpFor(3).name, CORPS[2].name);

  // Artifact hooks, driven by a stand-in tally.
  const die = v => ({ scoringValue: v, type: 'd6' });
  const tally = {
    scored: [die(6), die(6), die(3)],
    firstExecute: true,
    run: { scrap: 12, dice: ['d6', 'd6'], rerolls: 2, server: 3, stacks: { blockchain: 4, moore: 2 } },
  };
  check('overclocker', ARTIFACTS.overclock.perDie(tally, die(6))[0].value, 2);
  check('sniffer skips even', ARTIFACTS.sniffer.perDie(tally, die(4)), []);
  check('brute forcer', ARTIFACTS.brute.bonus(tally)[0].value, 15);
  check('hash collision', ARTIFACTS.hash.multiplier(tally)[0].value, 1.5);
  check('miner', ARTIFACTS.miner.bonus(tally)[0].value, 2);
  check('zero day', ARTIFACTS.zeroday.multiplier(tally)[0].value, 2);
  check('kernel panic needs all 4+', ARTIFACTS.kernel.multiplier(tally), []);
  check('blockchain compounds', ARTIFACTS.blockchain.multiplier(tally)[0].value,
    Math.pow(1.15, 4));
  check('blockchain stacks', ARTIFACTS.blockchain.stack(tally.run), '\u00d71.75');
  check("moore's law", ARTIFACTS.moore.multiplier(tally)[0].value, 8);
  check('trojan on first execute', ARTIFACTS.trojan.multiplier(tally)[0].value, 2);
  check('singularity compounds with server',
    ARTIFACTS.singularity.multiplier(tally)[0].value, Math.pow(1.6, 2));
  check('singularity does nothing on server 1',
    ARTIFACTS.singularity.multiplier({ run: { server: 1 } }), []);

  // Editions: every stamp either pays into an execute or widens the rig, and
  // charges for it. One that did neither would be a dead card in the market.
  const stamps = Object.keys(EDITIONS);
  check('four editions', stamps.length, 4);
  check('every edition pays or makes room',
    stamps.every(id => EDITIONS[id].flat || EDITIONS[id].late || EDITIONS[id].slots), true);
  check('every edition costs more than a plain one',
    stamps.every(id => EDITIONS[id].priceScale > 1), true);
  check('every edition has a tag, a colour and its own words',
    stamps.every(id => EDITIONS[id].tag && /^#[0-9a-f]{6}$/i.test(EDITIONS[id].color)
      && EDITIONS[id].desc), true);
  check('encrypted pays bits', EDITIONS.encrypted.flat()[0], { type: 'bits', value: 30, label: undefined });
  check('overclocked pays mult', EDITIONS.overclocked.flat()[0].type, 'mult');
  check('prismatic multiplies late', EDITIONS.prismatic.late()[0], { type: 'xmult', value: 1.5, label: undefined });
  check('only negative brings a slot',
    stamps.filter(id => slotsFrom(id)), ['negative']);
  check('an unknown stamp brings nothing', slotsFrom('holographic'), 0);
  check('known editions', [isKnownEdition('prismatic'), isKnownEdition('nope')], [true, false]);
  check('stamps get commoner with depth',
    editionChance(4) > editionChance(1), true);
  check('and the chance is capped', editionChance(99), 0.42);

  // Mirror dice copy the highest other value, and say which one they copied so
  // the board can draw it on them instead of a face they do not have.
  const pool = [{ type: 'mirror', value: 1 }, { type: 'd6', value: 5 }, { type: 'd8', value: 7 }];
  applyScoringValues(pool);
  check('mirror scores highest', pool.map(d => d.scoringValue), [7, 5, 7]);
  check('and records what it is copying', pool[0].mirrorOf, 7);
  check('the source is the die itself', mirrorSource(pool), pool[2]);
  check('an ordinary die never gets one', pool[1].mirrorOf, undefined);

  // Change the board and the mirror follows it, which is what makes it live.
  pool[1].value = 12;
  applyScoringValues(pool);
  check('the mirror follows the new highest', [pool[0].mirrorOf, pool[0].scoringValue], [12, 12]);
  check('and the source moves with it', mirrorSource(pool), pool[1]);

  // Nothing to copy: it falls back to its own face rather than scoring nothing.
  const allMirrors = [{ type: 'mirror', value: 4 }, { type: 'mirror', value: 2 }];
  applyScoringValues(allMirrors);
  check('with nothing to copy it uses its own face',
    allMirrors.map(d => d.scoringValue), [4, 2]);
  check('and shows that face', allMirrors.map(d => d.mirrorOf), [4, 2]);
  check('no source when every die mirrors', mirrorSource(allMirrors), null);

  // A blank face is a real, cached sprite, not a missing one.
  check('a blank face renders', [dieSprite('mirror', BLANK_FACE).width, BLANK_FACE], [16, 0]);
  check('blank is not the same sprite as a face',
    dieSprite('mirror', BLANK_FACE) === dieSprite('mirror', 5), false);
  check('a mirror die is blank on a shop card',
    dieIconURL('mirror') === dieSprite('mirror', BLANK_FACE).toDataURL(), true);
  check('an ordinary die is not',
    dieIconURL('d6') === dieSprite('d6', BLANK_FACE).toDataURL(), false);
  // A six-sided mirror can end up wearing a d20's 19, which has no pip layout.
  check('a borrowed value too big for pips still draws',
    dieSprite('mirror', 19).toDataURL() === dieSprite('mirror', BLANK_FACE).toDataURL(), false);
  check('and is not confused with another borrowed value',
    dieSprite('mirror', 19).toDataURL() === dieSprite('mirror', 12).toDataURL(), false);
  check('watchdog absorbs low', isAbsorbed({ scoringValue: 3 }, { boss: 'watchdog' }), true);
  check('watchdog spares high', isAbsorbed({ scoringValue: 4 }, { boss: 'watchdog' }), false);

  // Abilities operate on board dice through their context.
  const dice = [{ type: 'd6', value: 2, locked: false }, { type: 'd6', value: 5, locked: true }];
  const ctx = { dice, run: { rerolls: 0 }, log: () => {}, notify: () => {}, popDie: () => {} };
  ABILITIES.bitshift.use(ctx);
  check('bit shift skips locked', dice.map(d => d.value), [3, 5]);
  ABILITIES.defrag.use(ctx);
  check('defrag skips locked too, and caps at the face',
    dice.map(d => d.value), [6, 5]);
  ABILITIES.exploit.use(ctx);
  check('exploit maxes lowest', dice[0].value, 6);
  check('ddos adds rerolls', (ABILITIES.ddos.use(ctx), ctx.run.rerolls), 2);

  // Arming: a bigger multiplier wins, a smaller one is refused as a no-op.
  const armCtx = { run: { overdrive: 1, overdriveLabel: '' }, log: () => {}, notify: () => {} };
  ABILITIES.overdrive.use(armCtx);
  check('overdrive arms x2', [armCtx.run.overdrive, armCtx.run.overdriveLabel], [2, 'OVERDRIVE']);
  ABILITIES.sudo.use(armCtx);
  check('sudo overrides it', [armCtx.run.overdrive, armCtx.run.overdriveLabel], [4, 'SUDO']);
  check('and overdrive will not lower it', ABILITIES.overdrive.use(armCtx), false);
  check('leaving sudo armed', armCtx.run.overdrive, 4);

  // Tier 4 dice, where the late game does its damage.
  check('kernel exploit maxes everything', (() => {
    const pool = [{ type: 'd6', value: 2 }, { type: 'd20', value: 3 }];
    ABILITIES.kexploit.use({ ...ctx, dice: pool });
    return pool.map(d => d.value);
  })(), [6, 20]);
  check('polymorph is capped by each die', (() => {
    const pool = [{ type: 'd6', value: 1 }, { type: 'd20', value: 17 }];
    ABILITIES.polymorph.use({ ...ctx, dice: pool });
    return pool.map(d => d.value);
  })(), [6, 17]);
  check('nova always multiplies', DICE.nova.lateMultiplier({ scoringValue: 1 }), 1.5);
  check('daemon only on a 7 or 8',
    [DICE.daemon.lateMultiplier({ scoringValue: 6 }), DICE.daemon.lateMultiplier({ scoringValue: 7 })],
    [null, 2.5]);
  check('tesseract adds flat mult', DICE.tesseract.onScore()[0].value, 4);
  check('the biggest die is a fifty-sider', DICE.d50.faces, 50);
  check('and its two-digit faces render', dieSprite('d50', 50).width, 16);

  // Sprites render to real canvases.
  check('die sprite size', [dieSprite('d20', 17).width, dieSprite('d20', 17).height], [16, 16]);
  check('die icon is a PNG', dieIconURL('amp').startsWith('data:image/png'), true);
  check('icon is a PNG', iconURL('quantum', '#9a7bff').startsWith('data:image/png'), true);

  // Physics: thrown dice come to rest, and stay on the board.
  board.resizeBoard(200, 150, 3);
  board.setDicePool(['d6', 'd6', 'd6', 'd8', 'd12']);
  check('tray is on the board',
    board.dice.every(d => d.x > 0 && d.x < 200 && d.y > 0 && d.y < 150), true);
  board.throwDice(board.dice, { fullThrow: true });
  check('thrown dice are unsettled', board.allSettled(), false);
  for (let i = 0; i < 600; i++) board.stepPhysics(1 / 60);
  check('dice settle', board.allSettled(), true);
  check('dice stay in bounds',
    board.dice.every(d => d.x >= 8 && d.x <= 192 && d.y >= 10 && d.y <= 140), true);
  check('settled faces are real',
    board.dice.every(d => d.shownValue === d.value && d.value >= 1), true);
  check('roll clock resets on throw', board.secondsSinceThrow() > 0, true);

  // Threat levels ramp in one direction, and describe themselves honestly.
  check('tiers are in ramp order', DIFFICULTY_ORDER,
    ['script-kiddie', 'pen-tester', 'black-hat', 'nation-state']);
  check('firewalls get harder',
    DIFFICULTY_ORDER.map(id => DIFFICULTIES[id].firewallScale), [0.75, 1, 1.5, 2.2]);
  check('and get harder faster, the deeper a run gets',
    DIFFICULTY_ORDER.map(id => DIFFICULTIES[id].firewallRamp), [0.94, 1, 1.06, 1.12]);
  check('the hardest tier gives up a slot',
    DIFFICULTY_ORDER.map(id => DIFFICULTIES[id].artifactSlots), [5, 5, 5, 4]);
  check('a tier states its slots', difficultySummary('black-hat').includes('5 artifact slots'), true);
  check('unknown tier falls back', difficultyOf('nope').name, 'PEN TESTER');
  check('tier describes itself', difficultySummary('nation-state').includes('3 executes'), true);

  // Scoring.
  const finishedRun = {
    difficulty: 'black-hat', server: 3,
    stats: { nodes: 7, scrap: 120, biggest: 5000, dmg: 90000 },
  };
  check('run score', runScore(finishedRun), (7 * 500 + 2 * 2500 + 120 * 10) * 2);
  check('board sorts by score then depth', [
    { score: 10, server: 1, node: 1, biggest: 0 },
    { score: 99, server: 1, node: 1, biggest: 0 },
    { score: 99, server: 4, node: 1, biggest: 0 },
  ].sort(compareEntries).map(e => e.score + '/' + e.server), ['99/4', '99/1', '10/1']);

  // Seeded runs: the same seed has to roll the same dice.
  seedRun('ABC123');
  const firstRolls = Array.from({ length: 8 }, () => gameInt(1, 6));
  seedRun('ABC123');
  check('the same seed rolls the same dice',
    Array.from({ length: 8 }, () => gameInt(1, 6)), firstRolls);
  seedRun('DIFFERENT');
  check('a different seed diverges',
    Array.from({ length: 8 }, () => gameInt(1, 6)).join() !== firstRolls.join(), true);
  check('seeds are normalised', normaliseSeed('  my seed! '), 'MY-SEED');
  check('a blank seed gets a random one', seedRun('').length, 6);
  check('generated seeds are readable', /^[0-9A-HJKMNP-TV-Z]+$/.test(randomSeed()), true);

  // Saving mid-run stores where the stream got to, not just the seed.
  seedRun('STATE');
  gameInt(1, 6);
  const midStream = rngState();
  const nextValue = gameInt(1, 1000);
  restoreRng('STATE', midStream);
  check('a resumed run continues the stream', gameInt(1, 1000), nextValue);

  // Tournament codes carry the whole rule set between devices.
  const tournament = createTournament({
    name: 'night market', host: 'trinity', difficulty: 'black-hat', seed: 'RACE1',
    bans: { bosses: ['watchdog'], dice: ['d6'], artifacts: [], abilities: ['clone'] },
  });
  const rejoined = decodeTournament(tournament.code);
  check('op code is five characters', tournament.id.length, 5);
  check('op code avoids lookalike letters', /^[0-9A-HJKMNP-TV-Z]{5}$/.test(tournament.id), true);
  check('code keeps the id', rejoined.id, tournament.id);
  check('code upper-cases the name', rejoined.name, 'NIGHT MARKET');
  check('code keeps the fixed seed', rejoined.seed, 'RACE1');
  check('code keeps every ban', rejoined.bans,
    { bosses: ['watchdog'], dice: ['d6'], artifacts: [], abilities: ['clone'] });
  check('code stays short enough for a small QR', tournament.code.length <= 60, true);
  check('code uses only QR alphanumeric characters',
    /^[0-9A-Z $%*+\-.\/:]+$/.test(tournament.code), true);
  check('a truncated code is refused', decodeTournament(tournament.code.slice(0, 10)), null);
  check('a scanned join link decodes',
    decodeTournament('http://10.0.0.5:8000/#join=' + tournament.code).id, tournament.id);
  check('an op code is told apart from an invite code',
    [isOpCode(tournament.id), isOpCode(tournament.code)], [true, false]);

  // There is one board and it is the shared one. A browser-local fallback would
  // show private numbers and call them the leaderboard, so there is not one.
  check('the game talks to the shared board', store === remoteStore, true);
  check('and says so', [storeScope, store.scope], ['global', 'global']);
  check('nothing reads the local store for a board',
    ['listScores', 'listTournaments', 'listTournamentScores']
      .every(name => store[name] !== localStore[name]), true);

  // A reachable board answers with lists. The first check is the guard rail:
  // if the suite is not pointed at its own board it must not run the rest.
  check('the suite is on its own board, not the real one', API_BASE, FAKE_BOARD_URL);
  check('a board is configured', hasRemoteBoard() && !!API_BASE, true);
  check('scores read as a list', Array.isArray(await store.listScores({})), true);
  check('tournaments read as a list', Array.isArray(await store.listTournaments()), true);
  check('and a run banks', !!(await store.addScore(
    { id: 'smoke-1', handle: 'SMOKE', score: 1, difficulty: 'pen-tester', server: 1, node: 1 })), true);

  /*
   * A board is one row per runner per threat level, holding their best.
   *
   * Without this a leaderboard becomes a ranking of whoever played the most,
   * and the interesting case is the third post: a worse run arriving after a
   * better one has to be dropped, not appended and not swapped in because it
   * is newer.
   */
  const run = (id, handle, score, difficulty = 'pen-tester') =>
    store.addScore({ id, handle, score, difficulty, server: 1, node: 1, biggest: 0 });
  // Only the rows this section puts there: the board already has a run on it
  // from further up, and this is a check about merging, not about that.
  const MINE = ['MERGER', 'OTHER'];
  const boardOf = async difficulty =>
    (await store.listScores({ difficulty, limit: 50 }))
      .filter(row => MINE.includes(row.handle))
      .map(row => [row.handle, row.score]);

  await run('merge-1', 'MERGER', 100);
  await run('merge-2', 'MERGER', 500);
  await run('merge-3', 'MERGER', 300);
  check('three runs by one runner leave one row, the best of them',
    await boardOf('pen-tester'), [['MERGER', 500]]);

  await run('merge-4', 'MERGER', 50, 'black-hat');
  check('the same name on another threat level is its own row',
    await boardOf('black-hat'), [['MERGER', 50]]);
  check('and has not disturbed the first one',
    await boardOf('pen-tester'), [['MERGER', 500]]);

  await run('merge-5', 'OTHER', 400);
  check('someone else is a row of their own',
    await boardOf('pen-tester'), [['MERGER', 500], ['OTHER', 400]]);

  /*
   * A board that already has duplicates heals itself.
   *
   * The live board was filled under the old rule, so it holds several rows per
   * handle today. Nothing goes back and rewrites it — instead the next result a
   * handle posts takes every row of theirs with it, which is what these rows,
   * planted directly on the board, are checking.
   */
  fakeBoard.state.scores.push(
    { id: 'old-1', handle: 'LEGACY', score: 900, difficulty: 'pen-tester', server: 4, node: 1, biggest: 0 },
    { id: 'old-2', handle: 'LEGACY', score: 600, difficulty: 'pen-tester', server: 3, node: 1, biggest: 0 },
    { id: 'old-3', handle: 'LEGACY', score: 200, difficulty: 'pen-tester', server: 1, node: 1, biggest: 0 },
  );
  check('a board written under the old rule can hold several rows for one name',
    fakeBoard.state.scores.filter(row => row.handle === 'LEGACY').length, 3);

  await run('legacy-new', 'LEGACY', 10);
  const legacy = fakeBoard.state.scores.filter(row => row.handle === 'LEGACY');
  check('and the next run they post collapses them to one', legacy.length, 1);
  check('keeping the best of everything that was there', legacy[0].score, 900);

  /*
   * And the whole board can be brought into line in one go.
   *
   * Self-healing only reaches a handle that plays again; the maintenance call
   * catches the rest. It folds every row back through the same merge a new
   * result goes through, so the two can never disagree about who belongs.
   */
  fakeBoard.state.scores.push(
    { id: 'stale-1', handle: 'STALE', score: 800, difficulty: 'pen-tester', server: 4, node: 1, biggest: 0 },
    { id: 'stale-2', handle: 'STALE', score: 700, difficulty: 'pen-tester', server: 3, node: 1, biggest: 0 },
    { id: 'stale-3', handle: 'STALE', score: 20, difficulty: 'pen-tester', server: 1, node: 1, biggest: 0 },
  );
  ops.setAdminKey(FAKE_ADMIN_KEY);
  const compacted = await ops.compactBoard();
  const stale = fakeBoard.state.scores.filter(row => row.handle === 'STALE');
  check('collapsing the board reports what it removed', compacted.data.removed >= 2, true);
  check('and leaves one row for a name that had three', stale.length, 1);
  check('the best one', stale[0].score, 800);
  check('while everyone else is still there',
    fakeBoard.state.scores.some(row => row.handle === 'MERGER'), true);

  // Paging, which is how a board longer than a screen is read.
  for (let i = 0; i < 8; i++) await run('page-' + i, 'PAGER' + i, 300 - i);
  const firstPage = await store.listScores({ difficulty: 'pen-tester', limit: 4, offset: 0 });
  const thirdPage = await store.listScores({ difficulty: 'pen-tester', limit: 4, offset: 8 });
  check('a page is as long as it was asked to be', firstPage.length, 4);
  check('and the one after it carries on where it left off',
    thirdPage.map(row => row.handle),
    (await store.listScores({ difficulty: 'pen-tester', limit: 50 }))
      .slice(8, 12).map(row => row.handle));
  check('past the end of the board is empty, not the start of it',
    (await store.listScores({ difficulty: 'pen-tester', limit: 4, offset: 900 })).length, 0);

  /*
   * An unreachable board reads as null, never as an empty one.
   *
   * The difference is the whole point: [] means "nothing on the board yet" and
   * null means "there is no board to ask", and the screens say different things
   * for each. Getting this wrong would show every player an empty leaderboard
   * and call it the standings.
   */
  fakeBoard.setOffline(true);
  check('scores read as unreachable', await store.listScores({}), null);
  check('tournaments read as unreachable', await store.listTournaments(), null);
  check('a tournament board reads as unreachable', await store.listTournamentScores('X'), null);
  check('a live lobby reads as unreachable', await store.listLiveRuns('X'), null);
  check('and a run cannot be banked',
    await store.addScore({ id: 'smoke-2', handle: 'SMOKE' }), null);
  check('but a profile still works, being nothing to do with the board',
    typeof (await store.getProfile()).handle, 'string');
  fakeBoard.setOffline(false);
  check('and it comes back', Array.isArray(await store.listScores({})), true);

  // Preferences are the device's, and still work with no board at all.
  check('the profile is still local', typeof (await store.getProfile()).handle, 'string');

  // A tournament is visible once this device hosts or joins it, and not before.
  const seen = knownTournamentIds();
  check('an unknown tournament is not in the known list', seen.includes('ZZTOP'), false);
  rememberTournament('ZZTOP');
  check('joining one adds it', knownTournamentIds().includes('ZZTOP'), true);
  rememberTournament('ZZTOP');
  check('and twice is still once',
    knownTournamentIds().filter(id => id === 'ZZTOP').length, 1);
  forgetTournament('ZZTOP');
  check('leaving one drops it', knownTournamentIds().includes('ZZTOP'), false);

  /*
   * The maintenance API.
   *
   * Everything a player can delete, they can delete because their own browser
   * can prove it put it there. This is the other set of calls — the ones that
   * take a tournament somebody else hosted, or a result somebody else posted,
   * off the board for everyone — and the only thing standing in front of them
   * is a key that lives on the board and not in this repository.
   */
  const savedKey = ops.adminKey();

  ops.setAdminKey('');
  check('with no key there is nothing to call',
    (await ops.boardPing()).error, 'no key on this device');

  ops.setAdminKey('a-wrong-key-of-the-right-length');
  const refused = await ops.boardPing();
  check('a wrong key is refused', refused.ok, false);
  check('and the board will not say whether the key or the address was wrong',
    refused.error.includes('key refused'), true);

  ops.setAdminKey(FAKE_ADMIN_KEY);
  const ping = await ops.boardPing();
  check('the right key reads the board', ping.ok, true);
  check('and it answers in counts',
    ['scores', 'tournaments', 'live'].every(k => typeof ping.data[k] === 'number'), true);

  // A tournament this device did not host, put there the way another device
  // would have: with a host token of its own.
  await fetch(FAKE_BOARD_URL + '/api/tournaments/OTHERS', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: 'NOT MINE', host: 'THEM', code: tournament.code,
      difficulty: 'pen-tester', seed: 'AAAAA', secret: 'their-own-host-token',
    }),
  });
  check('a tournament hosted elsewhere is on the board',
    !!(await store.getTournament('OTHERS')), true);
  await store.deleteTournament('OTHERS');
  check('and the ordinary delete cannot touch it',
    !!(await store.getTournament('OTHERS')), true);
  check('maintenance takes it off for everyone', (await ops.wipeTournament('OTHERS')).ok, true);
  check('and then it is gone', await store.getTournament('OTHERS'), null);

  // One result off the global board, by the id of the run that made it.
  await store.addScore({
    id: 'drop-me', handle: 'NOBODY', score: 5, difficulty: 'pen-tester', server: 1, node: 1,
  });
  check('a result is on the board',
    (await store.listScores({})).some(row => row.id === 'drop-me'), true);
  check('and can be dropped by id', (await ops.dropScore('drop-me')).data.removed, 1);
  check('leaving the rest alone',
    (await store.listScores({})).some(row => row.id === 'drop-me'), false);

  /*
   * Purging a handle reaches every board, not just the global one.
   *
   * It is a name sweep and nothing more: a handle is a label a player types,
   * and the board has never known who anybody is, so anyone else who used the
   * same one goes with them. That is what makes it the honest version of
   * "delete this player's runs" and why it is worth checking it really does
   * reach the tournament boards too.
   */
  await store.saveTournament(tournament);
  await store.addScore({
    id: 'ghost-1', handle: 'GHOST', score: 900, difficulty: 'pen-tester', server: 3, node: 1,
  });
  await store.addTournamentScore(tournament.id, {
    id: 'ghost-2', handle: 'GHOST', score: 800, difficulty: 'black-hat', server: 2, node: 1,
  });
  await store.addTournamentScore(tournament.id, {
    id: 'keeper', handle: 'SOMEONE', score: 700, difficulty: 'black-hat', server: 2, node: 1,
  });
  const purged = await ops.purgeHandle('ghost');
  check('purging a handle takes both of its runs', purged.data.removed, 2);
  check('off the global board',
    (await store.listScores({})).some(row => row.handle === 'GHOST'), false);
  check('and off the tournament board',
    (await store.listTournamentScores(tournament.id)).some(row => row.handle === 'GHOST'), false);
  check('leaving everyone else on it',
    (await store.listTournamentScores(tournament.id)).map(row => row.handle), ['SOMEONE']);

  // Showing or hiding a tournament is this device's business, and stays here.
  const listed = (await ops.allTournaments()).data.map(row => row.id);
  check('maintenance lists every tournament, invited or not',
    listed.includes(tournament.id), true);
  ops.forgetTournament(tournament.id);
  check('hiding one here does not take it off the board',
    !!(await store.getTournament(tournament.id)), true);
  ops.rememberTournament(tournament.id);
  check('and it can be shown here again',
    knownTournamentIds().includes(tournament.id), true);

  ops.setAdminKey(savedKey);

  /*
   * QR format information.
   *
   * The data area can be flawless and the code still unreadable: the fifteen
   * format bits say which mask was used, and writing them in the wrong order
   * masks the data with one mask while announcing another. Nothing on screen
   * looks wrong, so it is checked here against the published words rather than
   * against ourselves.
   */
  const FORMAT_L = ['111011111000100', '111001011110011', '111110110101010', '111100010011101',
    '110011000101111', '110001100011000', '110110001000001', '110100101110110'];
  check('the format words are the published ones',
    FORMAT_L.map((_, mask) => formatBits(mask).toString(2).padStart(15, '0')), FORMAT_L);

  // Read the format modules back out, most significant bit first.
  const formatIn = (qr, copy) => {
    const n = qr.size;
    let bits = '';
    for (let i = 0; i < 15; i++) {
      let row;
      let col;
      if (copy === 1) {
        if (i < 6) { row = 8; col = i; }
        else if (i === 6) { row = 8; col = 7; }
        else if (i === 7) { row = 8; col = 8; }
        else if (i === 8) { row = 7; col = 8; }
        else { row = 14 - i; col = 8; }
      } else if (i < 7) { row = n - 1 - i; col = 8; }
      else { row = 8; col = n - 15 + i; }
      bits += qr.modules[row][col];
    }
    return bits;
  };

  const sample = qrMatrix('HTD-ABC1234567890');
  check('a code becomes a matrix', !!sample, true);
  check('sized as its version says', sample.size, 17 + 4 * sample.version);
  check('its format says the mask the data was masked with',
    formatIn(sample, 1), FORMAT_L[sample.mask]);
  check('and both copies of it agree', formatIn(sample, 2), formatIn(sample, 1));

  // A join URL needs byte mode, and is the payload a phone camera actually sees.
  const urlQR = qrMatrix('https://hackthedice.zanix.tech/#join=HTD-ABC123');
  check('a join URL fits in a QR', !!urlQR, true);
  check('and its format is written the same way',
    formatIn(urlQR, 1), FORMAT_L[urlQR.mask]);
  check('lower case and # force byte mode, so it is bigger', urlQR.size > sample.size, true);

  /*
   * Settings.
   *
   * The stored blob is the one piece of saved state a player can open a console
   * and edit, so everything that reads it has to survive whatever is in there.
   * These checks are about that rather than about the values themselves: a
   * scale of 40 should be a setting that did not take, not a game that will not
   * draw. The real ones are put back at the end, because this page shares
   * storage with the game.
   */
  const savedSettings = { ...settings };

  check('defaults are the ones the panel is written against',
    [DEFAULTS.uiScale, DEFAULTS.theme, DEFAULTS.effects, DEFAULTS.shake], [1, 'system', true, true]);

  check('a scale past the top is brought back to it', setSetting('uiScale', 40), SCALE_MAX);
  check('and past the bottom, back up', setSetting('uiScale', 0.01), SCALE_MIN);
  check('junk leaves the setting at its default',
    setSetting('uiScale', 'enormous'), DEFAULTS.uiScale);
  check('a volume cannot go negative', setSetting('sfxVolume', -3), 0);
  check('or past full', setSetting('musicVolume', 9), 1);
  check('a theme nobody has heard of is refused',
    setSetting('theme', 'neon'), DEFAULTS.theme);
  check('a theme we have is kept', setSetting('theme', 'dark'), 'dark');
  check('a key that is not a setting is not invented',
    [setSetting('godMode', true), 'godMode' in settings], [undefined, false]);

  check('speed cycles through the speeds it offers',
    [cycleSpeed(), cycleSpeed(), cycleSpeed()], [SPEEDS[1], SPEEDS[2], SPEEDS[0]]);
  check('mute is a flip', [toggleMuted(), toggleMuted()], [true, false]);

  resetSettings();
  check('reset puts everything back', { ...settings }, { ...DEFAULTS });

  /*
   * How far the interface can be scaled is a property of the screen, not a
   * preference: media queries cannot see the zoom the scale is made of, so past
   * a point the desktop layout would keep three columns it no longer has room
   * for. The exact ceiling depends on the window this is running in, so what is
   * checked is that there is one and that nothing is ever applied above it.
   */
  check('the ceiling is a scale we could actually use',
    maxUiScale() >= 1 && maxUiScale() <= SCALE_MAX, true);
  setSetting('uiScale', SCALE_MAX);
  check('and nothing is applied above it', uiScale() <= maxUiScale(), true);
  check('a narrow desktop window is what lowers it',
    innerWidth > TOUCH_WIDTH || maxUiScale() > 0, true);

  Object.assign(settings, savedSettings);
  saveSettings();
  check('this suite left the real settings alone', { ...settings }, savedSettings);

  /*
   * Key bindings, as they come back out of storage.
   *
   * The rebinder cannot produce two actions on one key or an action on Escape,
   * but the stored blob is a line of JSON a player can edit, so what matters is
   * what survives being read back. These are invariants of whatever is in there
   * rather than of any particular binding.
   */
  check('every action has a binding entry',
    ACTION_IDS.every(id => typeof binds[id] === 'string'), true);
  check('no two actions answer to the same key',
    new Set(ACTION_IDS.map(id => binds[id]).filter(Boolean)).size,
    ACTION_IDS.filter(id => binds[id]).length);
  check('nothing sits on a key the game reserves',
    ACTION_IDS.some(id => RESERVED.has(binds[id])), false);
  check('every action says what it is, for the settings screen',
    ACTION_IDS.every(id => ACTIONS[id].name && ACTIONS[id].help), true);
  check('codes print as the key on the keyboard',
    ['KeyR', 'Space', 'Digit1', 'Numpad5', 'Comma'].map(keyLabel),
    ['R', 'SPACE', '1', 'NUM 5', ',']);

  /*
   * Contracts.
   *
   * The catalog is deliberately nothing but data and pure predicates, so the
   * whole of it can be checked here with made-up contexts and no run in sight.
   * What is worth pinning is that each one fires on the thing it claims to and
   * not on the thing next to it — a contract for beating a boss in one Execute
   * that also fires on an ordinary node is worse than no contract.
   */
  const contract = (id, context) => ACHIEVEMENTS[id].test(context);
  const aRun = (extra = {}) => ({
    server: 1, node: 1, scrap: 0, executes: 3, difficulty: 'pen-tester',
    dice: ['d6', 'd6', 'd6'], artifacts: [], abilities: [], editions: {},
    stats: { dmg: 0, nodes: 0, biggest: 0, scrap: 0 }, ...extra,
  });

  check('every contract says when to look at it',
    ACHIEVEMENT_IDS.every(id => Object.values(Moment).includes(ACHIEVEMENTS[id].at)), true);
  check('and what it wants, in a sentence',
    ACHIEVEMENT_IDS.every(id => ACHIEVEMENTS[id].name && ACHIEVEMENTS[id].desc), true);
  check('every moment has something due at it',
    Object.values(Moment).every(moment => dueAt(moment).length > 0), true);

  check('a million in one hit', [1e6, 999999].map(total => contract('seven', { total })),
    [true, false]);
  check('overkill wants ten times the firewall, not ten times the damage',
    [contract('overkill', { total: 400, enemy: { max: 40 } }),
      contract('overkill', { total: 399, enemy: { max: 40 } })], [true, false]);

  // The one that is easiest to get wrong: all three conditions, not any of them.
  const boss = { boss: 'watchdog', max: 100 };
  check('one and done needs a boss, killed, on the first execute',
    [contract('oneshot', { killed: true, firstExecute: true, enemy: boss }),
      contract('oneshot', { killed: true, firstExecute: false, enemy: boss }),
      contract('oneshot', { killed: false, firstExecute: true, enemy: boss }),
      contract('oneshot', { killed: true, firstExecute: true, enemy: { max: 40 } })],
    [true, false, false, false]);

  check('no notes means every reroll still unspent',
    [contract('nonotes', { rerollsLeft: 2, rerollsAllowed: 2 }),
      contract('nonotes', { rerollsLeft: 1, rerollsAllowed: 2 }),
      // A tier with no rerolls to spend cannot earn it by having spent none.
      contract('nonotes', { rerollsLeft: 0, rerollsAllowed: 0 })],
    [true, false, false]);

  check('bare metal is about artifacts, not about the server',
    [contract('baremetal', { run: aRun({ server: 2 }) }),
      contract('baremetal', { run: aRun({ server: 2, artifacts: ['quantum'] }) })],
    [true, false]);
  check('full set wants one of each edition',
    [contract('fullset', { run: aRun({ editions: { a: 'encrypted', b: 'overclocked', c: 'prismatic', d: 'negative' } }) }),
      contract('fullset', { run: aRun({ editions: { a: 'encrypted', b: 'encrypted', c: 'prismatic', d: 'negative' } }) })],
    [true, false]);
  check('every slot counts the slots you have, not a fixed five',
    [contract('fullrig', { run: aRun({ artifacts: [1, 2, 3, 4, 5, 6] }), slots: 6 }),
      contract('fullrig', { run: aRun({ artifacts: [1, 2, 3, 4, 5] }), slots: 6 })],
    [true, false]);
  check('cashed out is for walking away, not for being traced',
    [contract('cashedout', { run: aRun({ stats: { nodes: 10 } }), reason: 'abandoned' }),
      contract('cashedout', { run: aRun({ stats: { nodes: 10 } }), reason: 'traced' }),
      contract('cashedout', { run: aRun({ stats: { nodes: 9 } }), reason: 'abandoned' })],
    [true, false, false]);
  check('full sweep is the ninth server, because eight bosses are behind it',
    [contract('fullsweep', { run: aRun({ server: 9 }) }),
      contract('fullsweep', { run: aRun({ server: 8 }) })], [true, false]);

  /*
   * The build stamp in the corner.
   *
   * build.json is written at deploy time, so the only thing worth checking here
   * is that a checkout with nothing deployed behind it says so rather than
   * inventing a version, and that a broken date is dropped rather than printed.
   */
  check('a deployed build reads as a version and a date',
    buildLabel({ version: 'v1.2', built: '2026-09-18T00:00:00Z' }).startsWith('v1.2 · '), true);
  check('a checkout says what it is', buildLabel({ version: 'dev', built: '' }), 'dev');
  check('a date nobody can parse is left off, not printed as Invalid Date',
    buildLabel({ version: 'v1.2', built: 'last tuesday' }), 'v1.2');
  check('and no version at all shows nothing', buildLabel({ version: '', built: '' }), '');

  // The soundtrack follows tension, not location.
  check('the menu has its own mood', moodFor({ phase: 'title' }), 'menu');
  check('an ordinary node', moodFor({ phase: 'ready', executes: 4, maxExecutes: 4, enemy: {} }), 'node');
  check('a boss node', moodFor({ phase: 'ready', executes: 4, enemy: { boss: 'revenant' } }), 'boss');
  check('the last execute beats the boss theme',
    moodFor({ phase: 'ready', executes: 1, enemy: { boss: 'revenant' } }), 'danger');
  check('a leak still draining is danger', moodFor({ phase: 'leakwait', executes: 3 }), 'danger');
  check('the market', moodFor({ phase: 'shop', executes: 4 }), 'shop');
  check('a finished run goes quiet', moodFor({ phase: 'over' }), 'silence');

  /*
   * A chord thicker than the note list is long.
   *
   * chord(level) plays 3 + level notes from six, so a caller asking for more
   * walked off the end and handed Web Audio an undefined frequency. It throws
   * from inside the scheduling call and takes down whatever was playing the
   * sound — the first time it happened it cost a whole breach mid-execute.
   *
   * It is catchable here because it throws when the note is scheduled, not when
   * anything is rendered: an offline context that is never played is enough.
   * tools/audio-test.html would be the natural home, but that suite needs a
   * real browser and nothing runs it on the way past.
   */
  const wasMuted = settings.muted;
  setSetting('muted', false);
  initAudio(new OfflineAudioContext(1, 4410, 44100));
  setMuted(false);

  let chordThrew = null;
  try {
    sfx.chord(99);
  } catch (error) {
    chordThrew = String(error.message || error);
  }
  check('a chord thicker than the notes it has does not throw', chordThrew, null);

  setSetting('muted', wasMuted);
  setMuted(true);

  check('every boss has a sound',
    ['bossOnline', 'quarantine', 'cipher', 'absorb', 'throttle', 'regen', 'extort', 'contain', 'restore']
      .every(name => typeof sfx[name] === 'function'), true);

  const summary = failures ? `${failures} FAILURE(S)` : 'ALL CHECKS PASSED';
  out.insertAdjacentHTML('beforeend', `<h1 class="${failures ? 'fail' : 'pass'}">${summary}</h1>`);

  // Append ?ping to mirror the result to the server log, for headless runs.
  if (location.search.includes('ping')) {
    await fetch('/__t/' + encodeURIComponent(summary)).catch(() => {});
  }
} catch (error) {
  out.insertAdjacentHTML('beforeend',
    `<div class="fail">LOAD ERROR: ${(error && error.stack) || error}</div>`);
}
</script>
</body>
</html>
