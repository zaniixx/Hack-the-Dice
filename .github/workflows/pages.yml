# Publishes the game to GitHub Pages on every push to main.
#
# The repository is the site: there is no build step, so the checkout is
# uploaded as-is. CNAME points the deployment at hackthedice.zanix.tech and
# .nojekyll stops GitHub trying to run the files through Jekyll.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Tags and history, so `git describe` can name the build something
          # better than a bare commit once there is a tag to find.
          fetch-depth: 0

      # What the game shows in the corner. Written here rather than committed,
      # because the only build date worth printing is the one the deploy stamped
      # on it — a number kept by hand goes stale the first time someone forgets.
      #
      # The release comes from the newest v-tag, which is the one part of this a
      # person decides: `git tag v0.4.0 && git push --tags` is what cuts a
      # release, and nothing else needs editing. Everything after that tag is
      # counted, because every push to main deploys and most builds are some way
      # past the last release — "v0.4.0" and "eleven commits after v0.4.0" are
      # different things to get a bug report about.
      - name: Stamp the build
        run: |
          RELEASE="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$RELEASE" ]; then
            COMMITS="$(git rev-list --count "$RELEASE"..HEAD)"
          else
            # Nothing tagged yet: there is no release to name, so the commit
            # stands on its own rather than a version nobody chose being made up.
            COMMITS="$(git rev-list --count HEAD)"
          fi
          SHA="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN="${{ github.run_number }}"
          cat > build.json <<JSON
          {"release":"$RELEASE","commits":$COMMITS,"sha":"$SHA","built":"$BUILT","run":"$RUN"}
          JSON
          cat build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
