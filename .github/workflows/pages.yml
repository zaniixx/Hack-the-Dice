# Publishes the game to GitHub Pages on every push to main.
#
# The repository is the site: there is no build step, so the checkout is
# uploaded as-is. CNAME points the deployment at hackthedice.zanix.tech and
# .nojekyll stops GitHub trying to run the files through Jekyll.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Tags and history, so `git describe` can name the build something
          # better than a bare commit once there is a tag to find.
          fetch-depth: 0

      # What the game shows in the corner. Written here rather than committed,
      # because the only build date worth printing is the one the deploy stamped
      # on it — a number kept by hand goes stale the first time someone forgets.
      - name: Stamp the build
        run: |
          VERSION="$(git describe --tags --always)"
          SHA="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN="${{ github.run_number }}"
          cat > build.json <<JSON
          {"version":"$VERSION","sha":"$SHA","built":"$BUILT","run":"$RUN"}
          JSON
          cat build.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
