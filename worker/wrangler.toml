# The shared board for Hack the Dice.
#
# One Worker, one KV namespace. See worker/README.md for the three commands
# that get this live.

name = "hack-the-dice-api"
main = "index.js"
compatibility_date = "2024-11-01"

# Created with:  npx wrangler kv namespace create BOARDS
# Paste the id it prints in below.
[[kv_namespaces]]
binding = "BOARDS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[observability]
enabled = true
